# lm_eval/tasks/tabmwp/tabmwp_8shot.yaml

task: tabmwp
description: "TabMWP: 8-shot evaluation on Tabular Math Word Problems"
dataset_path: "Arietem/tabmwp"
dataset_name: null
dataset_kwargs: null

training_split: train
test_split: train
fewshot_split: null

# Prompt 模板：表格 + 问题
doc_to_text: "Table: {{table}}, Question: {{question}}, Answer:"
doc_to_target: "{{target}}"

