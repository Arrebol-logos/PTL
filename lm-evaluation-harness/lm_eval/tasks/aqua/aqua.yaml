# 使用训练集里随机 8 条作为 few-shot
fewshot_config:
  sampler: default        # 从训练集中随机抽样
  seed: 42                # 可选：指定随机种子以便复现
  n_samples: 8            # 抽取 8 条
  samples: []             # 样本列表留空，由代码运行时自动填充

# 答案抽取：严格匹配 A–E
filter_list:
  - filter:
    - function: regex
      regex_pattern: 'The answer is (.+?)\.'
    - function: take_first
    name: letter-match

# 生成控制：禁用采样
generation_kwargs:
  do_sample: false

# Few-shot & 输出模式
num_fewshot: 8
output_type: generate_until

# 评测指标：准确率
metric_list:
  - metric: exact_match
    aggregation: mean
    higher_is_better: true

process_docs: !function utils.process_docs
