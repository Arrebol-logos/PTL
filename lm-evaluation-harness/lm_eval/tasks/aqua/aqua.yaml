# lm_eval/tasks/aqua/aqua_8shot.yaml

task: aqua
description: "AQuA-RAT: 8-shot evaluation on Algebra Question Answering with Rationales"
dataset_path: "deepmind/aqua_rat"
dataset_name: raw
dataset_kwargs: null

training_split: train
test_split: test
fewshot_split: train

# Prompt 模板：多选格式
doc_to_text: "Question: {{question}}, Answer Choices: {{options}}, Please answer the question by giving the letter of the chosen option. Answer:"
doc_to_target: "{{correct}}"

